name: docker-build-push

on:
  push:
    branches:
      - "master"
      - "main"
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      REGISTRY: 'registry.cn-hangzhou.aliyuncs.com'
      IMAGE_NAME: registry.cn-hangzhou.aliyuncs.com/dato/webhook-ui

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Aliyun Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,enable=true,priority=600,prefix=,suffix=,event=tag
            type=ref,enable=true,priority=500,prefix=,suffix=,event=branch
            type=sha,enable=true,prefix=,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Aliyun ACR rejects the OCI empty/attestation manifests BuildKit
          # attaches by default ("unknown manifest class"), so both are off.
          provenance: false
          sbom: false
